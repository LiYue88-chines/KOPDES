<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOPDES ONLINE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛒 KOPDES ONLINE</h1>
        <p>Pesan makanan & barang dari Kopdes</p>
    </header>


    <main>

        <!-- PRODUK -->
        <section class="produk">
            <h2>📦 Produk</h2>

            <div class="produk-list">

                <div class="card">
                    <div class="gambar">🍚</div>
                    <h3>Beras 5 Kg</h3>
                    <p>Rp75.000</p>
                    <button onclick="pilihProduk('Beras 5 Kg', 75000)">
                        Pilih
                    </button>
                </div>

                <div class="card">
                    <div class="gambar">🛢️</div>
                    <h3>Minyak Goreng</h3>
                    <p>Rp18.000</p>
                    <button onclick="pilihProduk('Minyak Goreng', 18000)">
                        Pilih
                    </button>
                </div>

                <div class="card">
                    <div class="gambar">🍜</div>
                    <h3>Mie Instan</h3>
                    <p>Rp4.000</p>
                    <button onclick="pilihProduk('Mie Instan', 4000)">
                        Pilih
                    </button>
                </div>

                <div class="card">
                    <div class="gambar">🥤</div>
                    <h3>Minuman</h3>
                    <p>Rp5.000</p>
                    <button onclick="pilihProduk('Minuman', 5000)">
                        Pilih
                    </button>
                </div>

            </div>
        </section>


        <!-- FORM PESANAN -->
        <section class="pesanan">

            <h2>📝 Form Pesanan</h2>

            <form id="orderForm">

                <label>Nama Pemesan</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama"
                    required
                >

                <label>Nomor WhatsApp</label>
                <input
                    type="tel"
                    id="whatsapp"
                    placeholder="08xxxxxxxxxx"
                    required
                >

                <label>Produk</label>
                <input
                    type="text"
                    id="produk"
                    placeholder="Pilih produk di atas"
                    readonly
                    required
                >

                <label>Jumlah</label>
                <input
                    type="number"
                    id="jumlah"
                    min="1"
                    value="1"
                    required
                >

                <label>Alamat</label>
                <textarea
                    id="alamat"
                    placeholder="Masukkan alamat pengantaran"
                    required
                ></textarea>

                <label>Catatan</label>
                <textarea
                    id="catatan"
                    placeholder="Contoh: Tolong diantar sore hari"
                ></textarea>

                <button type="submit" id="kirim">
                    🛒 Pesan Sekarang
                </button>

            </form>

            <p id="status"></p>

        </section>


        <!-- TOTAL -->
        <section class="total">

            <h2>💰 Total Pesanan</h2>

            <p id="total">
                Rp0
            </p>

        </section>

    </main>


    <footer>
        <p>© 2026 KOPDES ONLINE</p>
        <p>Pelayanan pemesanan barang & makanan desa</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
